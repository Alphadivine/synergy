<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synergy — Marvel Rivals team-up picker</title>
<meta name="description" content="Pick your Marvel Rivals hero, add your teammates, and see which of your two team-ups to run, based on real match stats.">
<meta name="theme-color" content="#0E1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="alternate icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="logo" src="logo.svg" alt="" width="46" height="46">
      <div>
        <h1>SYNERGY</h1>
        <p class="status" id="status">Loading stats…</p>
      </div>
    </div>
    <div class="controls">
      <div class="seg" id="viewSeg" role="group" aria-label="View"></div>
      <div class="seg" id="modeSeg" role="group" aria-label="Game mode"></div>
      <div class="seg" id="rankSeg" role="group" aria-label="Rank"></div>
      <div class="seg" id="seasonSeg" role="group" aria-label="Season"></div>
      <div class="seg" id="platSeg" role="group" aria-label="Your platform (for button names)"></div>
      <button class="btn ghost" id="compactBtn" type="button" aria-pressed="false" title="A big, glanceable view for a second monitor">Compact view</button>
      <button class="btn ghost" id="shareBtn" type="button" title="Copy a link with this hero and team">Copy link</button>
      <button class="btn ghost icon" id="helpBtn" type="button" aria-label="How to use Synergy" title="How to use Synergy">?</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="layout">
    <aside class="panel roster" aria-label="Hero roster">
      <div class="seg full" id="pickSeg" role="group" aria-label="What tapping a hero does"></div>
      <p class="hint" id="pickHint"></p>
      <label class="sr" for="search">Search heroes</label>
      <input id="search" type="search" placeholder="Search heroes…" autocomplete="off">
      <div class="chips" id="roleChips" role="group" aria-label="Filter by role"></div>
      <div class="grid-scroll"><div class="hero-grid" id="heroGrid"></div></div>
    </aside>

    <main class="main" id="main" aria-live="polite"></main>
  </div>

  <footer class="foot">
    <span>Stats from <a id="srcLink" href="https://rivalsmeta.com/team-ups" target="_blank" rel="noopener">RivalsMeta</a> (public team-up data, refreshed about twice a day).</span>
    <span>Fan-made tool, not affiliated with NetEase or Marvel.</span>
  </footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="modal" id="modal" hidden><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalBody"><div id="modalBody"></div><div class="modal-foot"><button type="button" class="linkish" id="modalSwap"></button><button type="button" class="btn primary" id="modalClose">Got it</button></div></div></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="guides.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
